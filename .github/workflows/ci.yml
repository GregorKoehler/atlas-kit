name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# ── How tests are gated ──────────────────────────────────────────────────────
# EVERY test file RUNS BY DEFAULT. The api job globs `api/test/**/*.test.mjs` and
# subtracts an explicit, commented opt-out list; the web job globs
# `web/src/**/*.test.mjs` through `npm test`, with no opt-out list at all. Adding
# a test file is therefore enough to gate it, and a file can only stop running if
# someone names it and says why, in the diff.
#
# That inversion is the whole point: a hand-maintained list of test files decays
# silently — files get added and never listed, and nobody notices that "green"
# meant "never ran". Silence must mean "runs", never "never runs".
#
# A test that needs box state must be made HERMETIC rather than listed as an
# opt-out: pin the ambient fact in the fixture (a temp dir, VAULTS_FILE,
# CLOUDFLARED_CONFIG, a stub HTTP server on an OS-assigned port). A test must
# never pass merely because the data or privilege it asserts on happens to be
# absent — that reads as coverage while guarding nothing.
#
# Per-test rationale is NOT duplicated here — every file in api/test carries a
# header comment explaining what it guards. `--test-reporter=spec` names each
# file and each failing test, so a failure still identifies itself.

jobs:
  web:
    name: web — typecheck + build + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      # Every *.test.mjs under web/src — the script globs them, so adding a file
      # is enough to gate it. They import the real `.ts` modules through node's
      # type stripping, so there is no build step and no browser involved.
      - run: npm test

  api:
    name: api — full test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json
      # tmux is the whole point of serve-tmux.test.sh; not preinstalled on the runner.
      - run: sudo apt-get update && sudo apt-get install -y tmux
      # Guards serve.sh's no-teardown invariant + ensure_session convergence.
      # Self-contained: a throwaway tmux socket, a stub command, no real ports.
      # A shell test, so it is not part of the api/test glob below.
      - run: bash scripts/serve-tmux.test.sh
      # Guards the semantic-search addon's self-heal GUARD CHAIN (backoff,
      # single-flight, failure bookkeeping) — the part that can turn a failing
      # install into a 5-minutely 1.4 GB download. Hermetic: temp dirs and a
      # file:// mirror, no network. Also a shell test, so also outside the glob.
      - run: bash addons/semantic-search/test/install.test.sh
      - name: install api deps
        working-directory: api
        run: npm ci
      - name: api tests — every *.test.mjs under api/test and addons/*/test
        working-directory: api
        run: |
          # Opt-out list: one `test/…` path per line, each with a reason on the
          # same line. EMPTY today — every file passes on a clean runner.
          cat > "$RUNNER_TEMP/ci-skip.txt" <<'SKIP'
          SKIP
          # `../addons` is in the glob so an ADDON's tests are gated by the same
          # rule as core's: adding a file is enough. Addon code imports node
          # built-ins and core modules only, so it runs on api/node_modules —
          # an addon that needed its own dependency would need its own job.
          files=$(find test ../addons -name '*.test.mjs' 2>/dev/null | sort | grep -vxFf "$RUNNER_TEMP/ci-skip.txt")
          echo "$files" | sed 's/^/  · /'
          node --test --test-reporter=spec $files
